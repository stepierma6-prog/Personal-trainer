:root{color-scheme:light;--bg:#edf1f5;--surface:#fff;--ink:#152435;--muted:#647487;--line:#dce4ec;--accent:#176c61;--dark:#101a27;--blue:#245895}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:42px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink);padding:9px 13px;font-weight:650}button:active{transform:translateY(1px)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.small{font-size:13px;min-height:36px;padding:6px 10px}button.danger{color:#a53636}button:disabled{opacity:.5}header{background:var(--dark);color:white;padding:22px max(18px,env(safe-area-inset-left)) 18px}header .inside,main,.nav-inner,.timer-inner{max-width:680px;margin:auto}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.6px;text-transform:uppercase;color:#9eb8c7}h1{font-size:29px;letter-spacing:-.8px;margin:4px 0 0}h2{font-size:22px;margin:0 0 10px;letter-spacing:-.4px}h3{font-size:17px;margin:0}.subtitle{color:#b4c3d1;margin:4px 0 14px;font-size:13px}.progress{height:7px;background:#344351;border-radius:20px;overflow:hidden}.progress span{display:block;background:#65d4b8;height:100%;transition:width .2s}.headrow,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.headrow{font-size:12px;color:#cbd6df;margin-bottom:7px}.nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.nav-inner{display:flex;gap:3px;padding:7px 12px}.nav button{flex:1;background:none;border:0;color:var(--muted);font-size:13px;min-height:40px;padding:8px 3px}.nav button.active{background:#e2f1ed;color:#12584e}main{padding:14px 12px 135px}.panel,.exercise{background:white;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 2px 6px #15243506}.notice{font-size:13px;background:#fff8e6;border:1px solid #e8d9af;border-radius:12px;padding:11px;margin:0 0 12px;color:#674f19}.muted{color:var(--muted);font-size:13px}.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--blue);background:#eaf1fa;border-radius:6px;padding:3px 7px;margin-bottom:6px}.tag.comp{color:#176c61;background:#e6f4ef}.exercise.done{border-color:#9fcdbf}.exercise .count{font-size:12px;color:var(--muted);white-space:nowrap}.target{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#f3f6f9;padding:9px;border-radius:10px;margin:10px 0}.target div{min-width:0}.target b{display:block;font-size:14px;overflow-wrap:anywhere}.target span{font-size:10px;display:block;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}.cue{font-size:13px;color:#495b6d;margin:8px 0 12px}.setgrid{display:grid;grid-template-columns:25px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center;margin-bottom:6px}.setgrid.head{font-size:11px;color:var(--muted);font-weight:650;text-align:center}.setgrid input{width:100%;min-width:0;text-align:center;padding:9px 2px;min-height:42px}.setgrid .num{font-size:12px;text-align:center;color:var(--muted)}input,textarea,select{border:1px solid #cad6e0;border-radius:9px;background:#fff;color:var(--ink);padding:10px;min-height:42px;width:100%;font-size:16px}input:focus,textarea:focus,select:focus{outline:2px solid #64ab9c;outline-offset:1px}textarea{resize:vertical;min-height:62px}label{display:block;font-size:12px;font-weight:650;color:#536479;margin:9px 0 4px}.check{padding:0;min-height:42px;font-size:20px;color:#8291a1}.check.checked{background:var(--accent);color:white;border-color:var(--accent)}.setgrid.complete input{background:#f1faf6;border-color:#b9d9cf}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions button{flex:1}.details{margin-top:12px}.details summary{color:var(--blue);font-size:13px;cursor:pointer;padding:6px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f2f5f8;padding:11px;border-radius:10px}.stat strong{font-size:23px;display:block}.stat span{font-size:11px;color:var(--muted)}.timer{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#101a27;color:white;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.timer-inner{display:flex;align-items:center;gap:8px}.timer-text{flex:1;min-width:95px}.timer-text small{display:block;color:#a8b8c5;font-size:11px}.timer-text strong{font-variant-numeric:tabular-nums;font-size:27px;line-height:1.1}.timer button{background:#273747;color:white;border:1px solid #415364;font-size:13px;padding:8px}.timer button.running{background:#176c61}.timer button:disabled{opacity:.4}.history-item{padding:11px 0;border-top:1px solid var(--line)}.history-item:first-child{border-top:0}.histline{font-size:13px;color:#526577;margin:4px 0;overflow-wrap:anywhere}.barline{display:grid;grid-template-columns:115px 1fr 30px;gap:9px;align-items:center;margin:10px 0;font-size:12px}.track{height:9px;border-radius:8px;background:#e9eef2;overflow:hidden}.track i{display:block;background:#358d7b;height:100%;border-radius:8px}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#101a27;color:#fff;border-radius:10px;padding:10px 16px;z-index:30;max-width:90%;font-size:13px;box-shadow:0 3px 15px #0003}dialog{border:none;border-radius:16px;width:min(94vw,520px);padding:18px;color:var(--ink);max-height:85vh;overflow:auto}dialog::backdrop{background:#101a2788}dialog textarea{min-height:180px}.empty{text-align:center;padding:20px;color:var(--muted)}[hidden]{display:none!important}@media print{.nav,.timer,.actions,.check,.notice,#toast,.no-print,button,dialog{display:none!important}body{background:white}header{background:white;color:black;padding:5px}.subtitle,.headrow,.eyebrow{color:#333}main{padding:0}.exercise,.panel{break-inside:avoid;box-shadow:none}.setgrid{grid-template-columns:25px 1fr 1fr 1fr}.exercise input,textarea{border:0}.progress{display:none}}
</style></head><body><header><div class="inside"><div class="eyebrow">Personal trainer · diario</div><h1>Il mio allenamento</h1><p class="subtitle" id="subtitle"></p><div class="headrow"><span id="progressText"></span><span id="saveStatus" role="status">Salvataggio locale</span></div><div class="progress"><span id="progressBar"></span></div></div></header><nav class="nav"><div class="nav-inner"><button data-tab="session" class="active">Scheda</button><button data-tab="history">Storico</button><button data-tab="volume">Volume</button><button data-tab="settings">Dati</button></div></nav><main id="main"></main><div class="timer"><div class="timer-inner"><div class="timer-text"><small id="timerLabel">Recupero</small><strong id="clock">00:00</strong></div><button id="t60">60 s</button><button id="t90">90 s</button><button id="t120">120 s</button><button id="stopTimer" aria-label="Ferma timer">Stop</button></div></div><div id="toast" role="status" hidden></div><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions"><button id="closeModal">Chiudi</button></div></dialog><input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
const SEED=[];
const KEY='allenamento.diario.v1'; const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const muscles=['Addome','Petto','Dorsali','Dorso alto','Deltoidi anteriori','Deltoidi laterali','Deltoidi posteriori','Tricipiti','Bicipiti','Quadricipiti','Glutei','Gluteo medio','Femorali','Altro'];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const dateLabel=d=>d?d.split('-').reverse().join('/'):'—';const clone=x=>JSON.parse(JSON.stringify(x));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const emptySet=()=>({kg:'',reps:'',rir:'',done:false});
function exercise(name,muscle,role,count,kg,reps,rir,rest,cue){return {id:uid(),name,muscle,role,kg:String(kg),reps,rir,rest,cue,note:'',sets:Array.from({length:count},emptySet)}}
const plan=[exercise('Crunch machine','Addome','Principale',3,'','12–15','2',75,'Carico da calibrare.'),exercise('Panca piana manubri','Petto','Principale',3,'','8–12','2',150,'Kg per manubrio.'),exercise('Lat machine','Dorsali','Principale',3,'','8–12','2',120,'Mantieni una traiettoria controllata.'),exercise('Alzate laterali','Deltoidi laterali','Principale',2,'','12–15','2',75,'Controlla il ritorno.'),exercise('Pushdown','Tricipiti','Complementare',2,'','10–12','2',75,'Gomiti stabili.')];
let storageOK=true;let state;try{const x=localStorage.getItem(KEY);state=x?JSON.parse(x):null;if(!state||!Array.isArray(state.history)||!state.draft||!Array.isArray(state.draft.exercises))state=null;}catch(e){storageOK=false;state=null}if(!state)state={version:1,draft:{id:uid(),date:today(),title:'Nuova seduta',note:'',example:false,exercises:[]},history:SEED,timer:null};let tab='session',toastHandle;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;$('#saveStatus').textContent='Salvato sul dispositivo'}catch(e){storageOK=false;$('#saveStatus').textContent='Non salvato · esporta i dati'}}
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toastHandle);toastHandle=setTimeout(()=>$('#toast').hidden=true,3000)}
function valid(s){return String(s.kg).trim()!==''&&Number(String(s.kg).replace(',','.'))>=0&&String(s.reps).trim()!==''&&Number.isInteger(Number(s.reps))&&Number(s.reps)>0&&/^(?:[0-9]|10)(?:\s*[-–]\s*(?:[0-9]|10))?$/.test(String(s.rir).trim())}const completed=e=>e.sets.filter(s=>s.done&&valid(s));const allDone=d=>d.exercises.flatMap(e=>completed(e));
function head(){let d=state.draft, n=allDone(d).length,t=d.exercises.reduce((a,e)=>a+e.sets.length,0);$('#subtitle').textContent=`${dateLabel(d.date)} · ${d.title||'Seduta'}`;$('#progressText').textContent=`${n} / ${t} serie completate`;$('#progressBar').style.width=(t?100*n/t:0)+'%';$('#saveStatus').textContent=storageOK?'Salvato sul dispositivo':'Non salvato · esporta i dati'}
function target(e){return `<div class="target"><div><span>Carico kg</span><b>${esc(e.kg||'Da calibrare')}</b></div><div><span>Reps</span><b>${esc(e.reps)}</b></div><div><span>RIR</span><b>${esc(e.rir)}</b></div><div><span>Recupero</span><b>${esc(e.rest)} s</b></div></div>`}
function session(){const d=state.draft;return `${!storageOK?'<div class="notice">Il browser non consente il salvataggio locale. Esporta un backup prima di chiudere.</div>':''}${d.example?'<div class="notice">Scheda di esempio proposta, non ancora eseguita. Modifica esercizi e obiettivi come preferisci.</div>':''}<section class="panel"><div class="grid2"><div><label for="date">Data seduta</label><input id="date" type="date" value="${esc(d.date)}" data-draft="date"></div><div><label for="title">Nome seduta</label><input id="title" value="${esc(d.title)}" data-draft="title"></div></div><p class="muted">Compila kg, reps e RIR reali, poi spunta la serie. Il peso indicato è un obiettivo, non un risultato.</p></section>${d.exercises.map((e,i)=>`<article class="exercise ${completed(e).length===e.sets.length&&e.sets.length?'done':''}" data-id="${esc(e.id)}"><div class="row"><span class="tag ${e.role==='Complementare'?'comp':''}">${esc(e.muscle)} · ${esc(e.role)}</span><span class="count">${completed(e).length}/${e.sets.length}</span></div><h3>${i+1}. ${esc(e.name)}</h3>${target(e)}<p class="cue">${esc(e.cue)}</p><div class="setgrid head"><span>#</span><span>Kg reali</span><span>Reps</span><span>RIR</span><span>Fatta</span></div>${e.sets.map((s,j)=>`<div class="setgrid ${s.done?'complete':''}"><span class="num">${j+1}</span><input aria-label="Serie ${j+1}, kg" inputmode="decimal" type="text" placeholder="${esc(e.kg||'kg')}" value="${esc(s.kg)}" data-set="${j}" data-field="kg"><input aria-label="Serie ${j+1}, ripetizioni" type="text" inputmode="numeric" placeholder="reps" value="${esc(s.reps)}" data-set="${j}" data-field="reps"><input aria-label="Serie ${j+1}, RIR" type="text" placeholder="${esc(e.rir)}" value="${esc(s.rir)}" data-set="${j}" data-field="rir"><button class="check ${s.done?'checked':''}" data-act="check" data-index="${j}" aria-label="${s.done?'Annulla':'Completa'} serie ${j+1}">${s.done?'✓':'○'}</button></div>`).join('')}<label>Feedback tecnico / prossima volta</label><textarea data-ex="note" placeholder="Sensazioni, tecnica, prossimo carico…">${esc(e.note)}</textarea><div class="actions"><button class="small" data-act="rest">Recupero ${esc(e.rest)} s</button><button class="small" data-act="addset">+ Serie</button><button class="small" data-act="removeset">− Serie</button></div><details class="details"><summary>Modifica esercizio / sostituisci</summary>${editFields(e)}<div class="actions"><button class="small" data-act="up">↑ Sposta</button><button class="small" data-act="down">↓ Sposta</button><button class="small danger" data-act="remove">Elimina</button></div></details></article>`).join('')}<button class="primary" style="width:100%;margin-bottom:12px" data-act="addex">+ Aggiungi esercizio</button><section class="panel"><label>Note generali della seduta</label><textarea data-draft="note" placeholder="Energia, recupero, fastidi, durata…">${esc(d.note)}</textarea><div class="actions"><button data-act="feedback">Copia feedback</button><button data-act="print">Stampa / PDF</button></div><button class="primary" style="width:100%;margin-top:9px" data-act="finish">Concludi e archivia seduta</button></section>`}
function editFields(e){return `<label>Esercizio / variante</label><input data-ex="name" value="${esc(e.name)}"><div class="grid2"><div><label>Distretto</label><select data-ex="muscle">${muscles.map(m=>`<option ${m===e.muscle?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div><label>Ruolo</label><select data-ex="role"><option ${e.role==='Principale'?'selected':''}>Principale</option><option ${e.role==='Complementare'?'selected':''}>Complementare</option></select></div><div><label>Kg previsti</label><input data-ex="kg" inputmode="decimal" value="${esc(e.kg)}"></div><div><label>Reps previste</label><input data-ex="reps" value="${esc(e.reps)}"></div><div><label>RIR previsto</label><input data-ex="rir" value="${esc(e.rir)}"></div><div><label>Recupero (secondi)</label><input data-ex="rest" type="number" min="1" max="3600" value="${esc(e.rest)}"></div></div><label>Indicazioni tecniche</label><textarea data-ex="cue">${esc(e.cue)}</textarea>`}
function history(){return `<h2>Storico sedute</h2><p class="muted">Solo serie registrate; la scheda in corso non viene conteggiata due volte.</p>${state.history.length?state.history.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`<section class="panel"><div class="row"><div><span class="tag">${dateLabel(d.date)}</span><h3>${esc(d.title)}</h3></div><span class="muted">${allDone(d).length} serie</span></div>${d.note?`<p class="muted">${esc(d.note)}</p>`:''}${d.exercises.map(e=>`<div class="history-item"><b>${esc(e.name)}</b><div class="histline">${completed(e).map(s=>`${esc(s.kg)} kg × ${esc(s.reps)} · RIR ${esc(s.rir)}`).join(' / ')}</div>${e.note?`<div class="muted">${esc(e.note)}</div>`:''}</div>`).join('')}<div class="actions"><button class="small" data-act="copyhistory" data-hid="${esc(d.id)}">Copia feedback</button><button class="small" data-act="reuse" data-hid="${esc(d.id)}">Duplica scheda</button><button class="small danger" data-act="delhistory" data-hid="${esc(d.id)}">Elimina</button></div></section>`).join(''):'<div class="panel empty">Nessuna seduta archiviata.</div>'}`}
let weekOffset=0;function weekRange(offset){let d=new Date(today()+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7)+7*offset);const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;let a=iso(d);d.setDate(d.getDate()+6);return [a,iso(d)]}
function volume(){const [a,b]=weekRange(weekOffset),ds=state.history.filter(d=>d.date>=a&&d.date<=b),counts=Object.fromEntries(muscles.map(m=>[m,0]));ds.forEach(d=>d.exercises.forEach(e=>{counts[e.muscle]=(counts[e.muscle]||0)+completed(e).length}));let total=Object.values(counts).reduce((a,b)=>a+b,0),max=Math.max(1,...Object.values(counts));return `<h2>Volume settimanale</h2><section class="panel"><div class="row"><button data-act="prevweek" class="small">‹</button><b>${dateLabel(a)} – ${dateLabel(b)}</b><button data-act="nextweek" class="small" ${weekOffset>=0?'disabled':''}>›</button></div><div class="statgrid" style="margin:14px 0"><div class="stat"><strong>${ds.length}</strong><span>Sedute</span></div><div class="stat"><strong>${total}</strong><span>Serie</span></div><div class="stat"><strong>${Object.values(counts).filter(v=>v>0).length}</strong><span>Distretti</span></div></div>${Object.entries(counts).map(([m,n])=>`<div class="barline"><span>${esc(m)}</span><div class="track"><i style="width:${100*n/max}%"></i></div><b style="text-align:right">${n}</b></div>`).join('')}<p class="muted">Una serie completata = una serie per il distretto principale. Il lavoro indiretto dei multiarticolari non è incluso. Solo sedute archiviate.</p></section>`}
function settings(){return `<h2>Dati e gestione</h2><section class="panel"><h3>Nuova scheda</h3><p class="muted">Sostituisce la scheda in corso; le sedute archiviate restano nello storico.</p><div class="actions"><button data-act="blank">Scheda vuota</button><button data-act="sample">Esempio upper</button></div><button style="width:100%;margin-top:8px" data-act="pasteplan">Importa scheda JSON da ChatGPT</button></section><section class="panel"><h3>Backup e registro Excel</h3><p class="muted">I dati restano nel browser di questo dispositivo. Il file Excel originale non viene modificato automaticamente. Il CSV contiene le serie archiviate nello stesso ordine di colonne del registro.</p><div class="actions"><button data-act="backup">Esporta backup JSON</button><button data-act="import">Importa backup</button><button data-act="csv">Esporta CSV</button></div><p class="muted">Il backup include anche la scheda in corso. Esportalo prima di spostare la pagina o cancellare i dati del browser.</p></section><section class="panel"><h3>Salvataggio</h3><p class="muted">${storageOK?'Archivio locale disponibile in questa sessione.':'Archivio locale non disponibile: usa il backup manuale.'} Non c'è sincronizzazione tra dispositivi o con ChatGPT. Per un utilizzo stabile su iPhone, la pagina va pubblicata su un indirizzo HTTPS e aperta in Safari.</p><p class="muted">Per recuperare il tuo storico, importa il backup JSON personale da questa sezione. Non caricarlo nel repository pubblico.</p></section>`}
function render(){const main=$('#main');main.innerHTML=({session,history,volume,settings}[tab])();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));head()}
function switchTab(t){tab=t;render();window.scrollTo(0,0)}function update(){save();head()}
function refreshCard(card,e){card.classList.toggle('done',e.sets.length>0&&completed(e).length===e.sets.length);card.querySelector('.count').textContent=`${completed(e).length}/${e.sets.length}`;const tmp=document.createElement('div');tmp.innerHTML=target(e);card.querySelector('.target').replaceWith(tmp.firstElementChild);card.querySelector('h3').textContent=`${state.draft.exercises.indexOf(e)+1}. ${e.name}`;card.querySelector('.cue').textContent=e.cue;const tag=card.querySelector('.tag');tag.textContent=`${e.muscle} · ${e.role}`;tag.classList.toggle('comp',e.role==='Complementare')}
function feedback(d){return `Feedback allenamento ${dateLabel(d.date)} — ${d.title}\n\n`+d.exercises.filter(e=>completed(e).length||e.note).map(e=>`- ${e.name}: ${completed(e).map((s,i)=>`${i+1}ª ${s.kg} kg × ${s.reps} reps RIR ${s.rir}`).join('; ')}${e.note?' — '+e.note:''}`).join('\n')+(d.note?'\n\nNote generali: '+d.note:'')}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast('Feedback copiato')}catch(e){modal('Copia feedback',`<textarea id="copybox" readonly>${esc(txt)}</textarea><p class="muted">Tieni premuto sul testo e seleziona Copia.</p>`);$('#copybox').select()}}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csv(){let rows=[['Data','Esercizio / variante','Distretto principale','Ruolo','N. serie','Carico (kg)','Ripetizioni','RIR','Feedback tecnico / prossima volta']];state.history.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(d=>d.exercises.forEach(e=>e.sets.forEach((s,i)=>{if(s.done&&valid(s))rows.push([dateLabel(d.date),e.name,e.muscle,e.role,i+1,String(s.kg).replace('.',','),s.reps,s.rir,e.note+(d.note?' | '+d.note:'')])})));const cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download('Registro_allenamenti_'+today()+'.csv','\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal()}$('#closeModal').onclick=()=>$('#modal').close();
function replaceDraft(exercises,title,example=false){if(state.draft.exercises.length&&!confirm('Sostituire la scheda in corso? I feedback non archiviati verranno persi.'))return;state.draft={id:uid(),date:today(),title,note:'',example,exercises};save();switchTab('session')}
function startTimer(seconds){let s=Number(seconds);if(!Number.isFinite(s)||s<1||s>3600)return toast('Inserisci un recupero da 1 a 3600 secondi');state.timer={until:Date.now()+s*1000};save();tick()}
let lastTimerEnd=0;function tick(){let until=state.timer?.until||0;let sec=Math.max(0,Math.ceil((until-Date.now())/1000));$('#clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');$('#timerLabel').textContent=sec?'Recupero in corso':until?'Recupero terminato':'Recupero';$('#stopTimer').disabled=!until;if(until&&sec===0&&lastTimerEnd!==until){lastTimerEnd=until;try{navigator.vibrate?.(200)}catch(e){}toast('Recupero terminato')}}setInterval(tick,250);$('#t60').onclick=()=>startTimer(60);$('#t90').onclick=()=>startTimer(90);$('#t120').onclick=()=>startTimer(120);$('#stopTimer').onclick=()=>{state.timer=null;save();tick()};
function getEx(el){const card=el.closest('[data-id]');return [card,card&&state.draft.exercises.find(e=>e.id===card.dataset.id)]}
$('#main').addEventListener('input',ev=>{const el=ev.target,[card,e]=getEx(el);if(el.dataset.draft){state.draft[el.dataset.draft]=el.value;update()}else if(e&&el.dataset.set!==undefined){const s=e.sets[Number(el.dataset.set)];s[el.dataset.field]=el.value;if(s.done&&!valid(s)){s.done=false;const row=el.closest('.setgrid');row.classList.remove('complete');const b=row.querySelector('button');b.textContent='○';b.classList.remove('checked');b.setAttribute('aria-label','Completa serie '+(Number(el.dataset.set)+1))}update();refreshCard(card,e)}else if(e&&el.dataset.ex){e[el.dataset.ex]=el.dataset.ex==='rest'?Number(el.value):el.value;update();refreshCard(card,e)}});
$('#main').addEventListener('change',ev=>{if(ev.target.tagName==='SELECT')ev.target.dispatchEvent(new Event('input',{bubbles:true}))});
$('#main').addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,[card,e]=getEx(b),i=e?state.draft.exercises.indexOf(e):-1;const d=state.history.find(x=>x.id===b.dataset.hid);switch(act){case 'check':{const s=e.sets[Number(b.dataset.index)];if(!s.done&&!valid(s)){toast('Compila kg (anche 0), reps e RIR validi');return}s.done=!s.done;update();const row=b.closest('.setgrid');row.classList.toggle('complete',s.done);b.classList.toggle('checked',s.done);b.textContent=s.done?'✓':'○';b.setAttribute('aria-label',(s.done?'Annulla':'Completa')+' serie '+(Number(b.dataset.index)+1));refreshCard(card,e);if(s.done)startTimer(e.rest);return}case 'rest':startTimer(e.rest);return;case 'addset':e.sets.push(emptySet());break;case 'removeset':if(e.sets.length<=1)return toast('Mantieni almeno una serie');if(e.sets.at(-1).done&&!confirm('Rimuovere l’ultima serie registrata?'))return;e.sets.pop();break;case 'remove':if(!confirm('Eliminare questo esercizio?'))return;state.draft.exercises.splice(i,1);break;case 'up':if(i>0)[state.draft.exercises[i-1],state.draft.exercises[i]]=[e,state.draft.exercises[i-1]];break;case 'down':if(i<state.draft.exercises.length-1)[state.draft.exercises[i+1],state.draft.exercises[i]]=[e,state.draft.exercises[i+1]];break;case 'addex':state.draft.exercises.push(exercise('Nuovo esercizio','Altro','Complementare',2,'','10–12','2',90,''));break;case 'feedback':copy(feedback(state.draft));return;case 'print':window.print();return;case 'finish':{let n=allDone(state.draft).length, total=state.draft.exercises.reduce((a,e)=>a+e.sets.length,0);if(!n)return toast('Completa almeno una serie');if(!/^\d{4}-\d{2}-\d{2}$/.test(state.draft.date))return toast('Inserisci una data');if(!confirm(`Archiviare ${n} serie su ${total} previste? Le serie non spuntate non verranno archiviate.`))return;let saved=clone(state.draft);saved.exercises=saved.exercises.map(e=>({...e,sets:completed(e)})).filter(e=>e.sets.length);saved.example=false;state.history.push(saved);state.draft={id:uid(),date:today(),title:'Nuova seduta',note:'',example:false,exercises:[]};state.timer=null;save();switchTab('history');toast('Seduta archiviata');return}case 'copyhistory':copy(feedback(d));return;case 'reuse':replaceDraft(d.exercises.map(e=>({...clone(e),id:uid(),note:'',sets:e.sets.map(emptySet)})),d.title+' · nuova');return;case 'delhistory':if(!confirm('Eliminare definitivamente questa seduta dallo storico locale?'))return;state.history=state.history.filter(x=>x.id!==d.id);break;case 'prevweek':weekOffset--;break;case 'nextweek':weekOffset=Math.min(0,weekOffset+1);break;case 'blank':replaceDraft([],'Nuova seduta');return;case 'sample':replaceDraft(clone(plan),'Upper · esempio modificabile',true);return;case 'backup':download('Allenamento_backup_'+today()+'.json',JSON.stringify(state,null,2),'application/json');return;case 'import':$('#importFile').click();return;case 'csv':csv();return;case 'pasteplan':modal('Importa una scheda',`<p class="muted">Chiedi a ChatGPT una scheda in JSON nel formato indicato, poi incollala qui. I dati reali partono vuoti.</p><button id="schemaBtn" class="small">Copia formato da chiedere a ChatGPT</button><textarea id="planInput" placeholder="{ &quot;title&quot;: &quot;Upper&quot;, &quot;exercises&quot;: [...] }"></textarea><button class="primary" id="applyPlan">Carica scheda</button>`);$('#schemaBtn').onclick=()=>copy('Genera la prossima scheda allenamento in JSON puro, senza markdown, con questo schema: '+JSON.stringify({title:'Nome seduta',exercises:[{name:'Esercizio',muscle:'Petto',role:'Principale',count:3,kg:'28',reps:'10–12',rir:'2',rest:120,cue:'Indicazioni tecniche'}]})+'; distretti consentiti: '+muscles.join(', ')+'.');$('#applyPlan').onclick=()=>{try{const p=JSON.parse($('#planInput').value.replace(/^```(?:json)?\s*/,'').replace(/\s*```$/,''));if(!p||!Array.isArray(p.exercises)||p.exercises.length<1||p.exercises.length>40)throw Error();const xs=p.exercises.map(x=>{if(!x.name||!muscles.includes(x.muscle)||!['Principale','Complementare'].includes(x.role)||!Number.isInteger(x.count)||x.count<1||x.count>20||!Number.isFinite(Number(x.rest))||Number(x.rest)<1||Number(x.rest)>3600)throw Error();return exercise(String(x.name),x.muscle,x.role,x.count,x.kg??'',String(x.reps??''),String(x.rir??''),Number(x.rest),String(x.cue??''))});$('#modal').close();replaceDraft(xs,String(p.title||'Nuova scheda'))}catch(err){toast('JSON non valido: controlla il formato')}};return;default:return}save();render();if(act==='addex')$('#main .exercise:last-of-type')?.scrollIntoView({block:'center',behavior:'smooth'})});
function validBackup(x){const str=v=>typeof v==='string'||typeof v==='number';const validEx=e=>e&&typeof e.id==='string'&&typeof e.name==='string'&&muscles.includes(e.muscle)&&['Principale','Complementare'].includes(e.role)&&Array.isArray(e.sets)&&e.sets.every(s=>s&&str(s.kg)&&str(s.reps)&&str(s.rir)&&typeof s.done==='boolean')&&str(e.kg)&&str(e.reps)&&str(e.rir)&&Number(e.rest)>=1&&Number(e.rest)<=3600;const validD=d=>d&&typeof d.id==='string'&&typeof d.title==='string'&&typeof d.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.date)&&Array.isArray(d.exercises)&&d.exercises.every(validEx);return x&&x.version===1&&validD(x.draft)&&Array.isArray(x.history)&&x.history.every(validD)}
$('#importFile').addEventListener('change',async ev=>{let f=ev.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!validBackup(x))throw Error();if(confirm('Sostituire i dati locali con questo backup?')){state=x;state.timer=null;save();switchTab('session');toast('Backup importato')}}catch(e){toast('Backup non valido')}finally{ev.target.value=''}});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));save();render();tick();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
